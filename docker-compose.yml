# Entorno local con MariaDB 11.8.8 y Django.
services:
  database:
    image: mariadb:11.8.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-agrotech_t}
      MARIADB_USER: ${DB_USER:-agrotech}
      MARIADB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      DB_HOST: database
      DB_PORT: 3306
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
